name: calendar

services:
  radicale:
    build: ./radicale
    image: calendar-radicale:local
    restart: unless-stopped
    env_file: secrets/common.env
    volumes:
      - radicale-data:/var/lib/radicale/collections
      - ./secrets/radicale-users:/etc/radicale/users:ro
    # On BIND_ADDRESS:RADICALE_PORT (.env), for a Newt running directly on the
    # host and for local checks. A Newt container on the "calendar" network
    # uses radicale:5232.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RADICALE_PORT:-5232}:5232"
    networks:
      - calendar
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Ingest API: text in, events out. Exposed as ingest.<domain> via Pangolin.
  ingest:
    build: ./app
    image: calendar-app:local
    restart: unless-stopped
    command: ["uvicorn", "calapp.ingest.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
    # Username/time zone, then ingest's own secrets (password, key hashes).
    env_file:
      - secrets/common.env
      - secrets/ingest.env
    environment:
      CALDAV_URL: http://radicale:5232
      CALDAV_USER: ingest
      INGEST_CALENDAR: ${INGEST_CALENDAR:-personal}
      LLM_URL: http://llm:8080
      DEFAULT_EVENT_MINUTES: ${DEFAULT_EVENT_MINUTES:-60}
      INGEST_RATE_LIMIT_PER_HOUR: ${INGEST_RATE_LIMIT_PER_HOUR:-30}
      INGEST_ALL_DAY_CONFLICTS: ${INGEST_ALL_DAY_CONFLICTS:-false}
      # Confidence check (Kev-4B) and review queue; see docs/DESIGN.md §8.
      CHECKER_URL: ${CHECKER_URL-http://checker:8080}
      CHECK_THRESHOLD: ${CHECK_THRESHOLD:-0.5}
    volumes:
      - ingest-data:/data
    # For a Newt running directly on the host (port set in .env). A Newt
    # container on the "calendar" network uses ingest:8000.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${INGEST_PORT:-8000}:8000"
    networks:
      - calendar
      - llm
    depends_on:
      - radicale
      - llm
      - checker
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Read-only agenda view. Exposed as agenda.<domain> via Pangolin, with
  # Pangolin's login switched ON for that resource.
  web:
    image: calendar-app:local
    build: ./app
    restart: unless-stopped
    command: ["uvicorn", "calapp.web.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
    # Username/time zone, then the agenda account's password (and optional login hash).
    env_file:
      - secrets/common.env
      - secrets/web.env
    environment:
      CALDAV_URL: http://radicale:5232
      CALDAV_USER: agenda
      AGENDA_DAYS: ${AGENDA_DAYS:-14}
    # For a Newt running directly on the host (port set in .env). A Newt
    # container on the "calendar" network uses web:8000.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AGENDA_PORT:-8001}:8000"
    networks:
      - calendar
    depends_on:
      - radicale
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Local LLM (llama.cpp server). Never exposed through Pangolin: it is only
  # on the "llm" network (shared with the ingest service) and on 127.0.0.1
  # for scripts/bench_llm.py.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11804
    restart: unless-stopped
    # llama-server does not accept "--flag=value"; flag and value are separate.
    command:
      - --model
      - /models/${LLM_MODEL_FILE:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      - --threads
      - ${LLM_THREADS:-6}
      - --ctx-size
      - ${LLM_CTX_SIZE:-8192}
      # One request at a time; the ingest service queues jobs.
      - --parallel
      - "1"
      # Prompt cache in RAM (MiB). The default of 8 GiB is too much for this box.
      - --cache-ram
      - "1024"
      - --no-webui
      - --no-slots
    volumes:
      - ./models:/models:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${LLM_PORT:-8080}:8080"
    networks:
      - llm
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 10g

  # Confidence checker: Kev-4B decision model on the same llama.cpp image
  # (/v1/systemone). Internal only, like the llm service.
  checker:
    image: ghcr.io/ggml-org/llama.cpp:server-b11804
    restart: unless-stopped
    command:
      - --model
      - /models/${CHECKER_MODEL_FILE:-Kev-4B-Q4_K_M.gguf}
      - --threads
      - ${LLM_THREADS:-6}
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
      - --cache-ram
      - "512"
      - --no-webui
      - --no-slots
    volumes:
      - ./models:/models:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CHECKER_PORT:-8082}:8080"
    networks:
      - llm
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 6g

  # Pangolin site connector. Only needed if Newt does not already run on this
  # box: start with `docker compose --profile newt up -d`.
  newt:
    image: fosrl/newt:latest
    profiles:
      - newt
    restart: unless-stopped
    env_file:
      - path: secrets/newt.env
        required: false
    networks:
      - calendar

volumes:
  radicale-data:
  ingest-data:

networks:
  calendar:
    name: calendar
  llm:
    name: calendar-llm
